schema_version = "1.0.0"
id = "real_uniform_generator"
version = "0.5.0"
name = "Real Uniform Generator"
tagline = "Pattern-based realistic Japanese school pleated skirts"
maintainer = "tomicodev"
type = "add-on"

blender_version_min = "4.3.0"
license = ["SPDX:MIT"]
tags = ["Modeling", "Mesh", "Material"]

[permissions]
files = "Load external PBR textile maps and export skirt models previews and textures"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "*.pyo",
    ".*",
    "*.zip",
]
