schema_version = "1.0.0"
id = "real_uniform_generator"
version = "0.2.0"
name = "Real Uniform Generator"
tagline = "Generate realistic configurable Japanese school pleated skirts"
maintainer = "tomicodev"
type = "add-on"

blender_version_min = "4.3.0"
license = ["SPDX:MIT"]
tags = ["Modeling", "Mesh", "Material"]

[permissions]
files = "Export skirt models previews and generated texture images"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "*.pyo",
    ".*",
    "*.zip",
]
