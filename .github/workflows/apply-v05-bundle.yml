name: Apply v0.5.0 Source Bundle

on:
  push:
    branches: [main]
    paths:
      - 'tools/v05_bundle.ready'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-real-uniform-generator-v05
  cancel-in-progress: false

jobs:
  apply-source-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract v0.5.0 source bundle
        run: |
          cat tools/v05_bundle.part* | base64 --decode > /tmp/rug-v05.zip
          unzip -o /tmp/rug-v05.zip -d .
          rm -f tools/v05_bundle.part* tools/v05_bundle.ready
          rm -f tools/v03_bundle.part*
          rm -f .github/workflows/apply-v03-bundle.yml
          rm -f .github/workflows/apply-v05-bundle.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Validate generated source
        run: |
          python -m compileall -q real_uniform_generator tests
          python tests/test_pattern_math.py
          python - <<'PY'
          import tomllib
          from pathlib import Path
          with Path('real_uniform_generator/blender_manifest.toml').open('rb') as file:
              manifest = tomllib.load(file)
          assert manifest['version'] == '0.5.0', manifest
          required = [
              'real_uniform_generator/pattern.py',
              'real_uniform_generator/material_io.py',
              'docs/ADOBE_ENVATO_WORKFLOW.md',
              'docs/FABRIC_CAPTURE_GUIDE.md',
          ]
          for value in required:
              assert Path(value).exists(), value
          print('v0.5.0 source bundle validated')
          PY

      - name: Commit v0.5.0 source to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Rebuild skirt generator around real garment construction v0.5.0'
          git push origin HEAD:main
