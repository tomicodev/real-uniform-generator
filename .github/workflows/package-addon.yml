name: Validate Package and Test Blender Add-on v0.5.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: real-uniform-generator-v05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile loader and embedded runtime modules
        run: |
          python -m py_compile real_uniform_generator/__init__.py tests/*.py
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from zipfile import ZipFile

          path = Path('real_uniform_generator/v05_runtime_payload.b64')
          encoded = ''.join(path.read_text(encoding='utf-8-sig').split())
          encoded += '=' * (-len(encoded) % 4)
          payload = base64.b64decode(encoded, validate=True)
          required = {
              'constants.py', 'pattern.py', 'properties.py', 'material_io.py',
              'textures.py', 'materials.py', 'geometry.py', 'finishing.py',
              'exporter.py', 'preview.py', 'operators.py', 'ui.py',
          }
          with ZipFile(io.BytesIO(payload)) as archive:
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f'Runtime ZIP member is corrupt: {bad_member}')
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f'Runtime payload is missing: {sorted(missing)}')
              for name in sorted(required):
                  compile(archive.read(name).decode('utf-8-sig'), name, 'exec')
          print('Embedded runtime modules compile successfully')
          PY

      - name: Test continuous pleat pattern mathematics
        run: python tests/test_pattern_math.py

      - name: Validate package structure and manifest
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          package = Path('real_uniform_generator')
          required = {
              '__init__.py', 'v05_runtime_payload.b64', 'LICENSE.txt',
              'blender_manifest.toml',
          }
          present = {path.name for path in package.iterdir() if path.is_file()}
          missing = required - present
          if missing:
              raise SystemExit(f'Missing package files: {sorted(missing)}')

          with (package / 'blender_manifest.toml').open('rb') as file:
              manifest = tomllib.load(file)
          assert manifest['id'] == 'real_uniform_generator'
          assert manifest['version'] == '0.5.0', manifest
          assert manifest['blender_version_min'] == '4.3.0'
          print('Package and manifest OK')
          PY

      - name: Create portable fallback ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path('real_uniform_generator')
          output = Path('dist/real_uniform_generator-v0.5.0-fallback.zip')
          output.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts or path.suffix in {'.pyc', '.pyo'}:
                      continue
                  archive.write(path, path.relative_to(source).as_posix())
          with ZipFile(output) as archive:
              root = set(archive.namelist())
              required = {'__init__.py', 'blender_manifest.toml', 'LICENSE.txt', 'v05_runtime_payload.b64'}
              missing = required - root
              if missing:
                  raise SystemExit(f'Archive root is invalid: {sorted(missing)}')
          print(output)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: real_uniform_generator-v0.5.0-fallback
          path: dist/real_uniform_generator-v0.5.0-fallback.zip
          if-no-files-found: error
          retention-days: 30

  blender-runtime-test:
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLENDER_URL: https://cdn.builder.blender.org/download/daily/blender-5.2.0-stable%2Bv52.fbe6228777e7-linux.x86_64-release.tar.xz
      BLENDER_USER_RESOURCES: ${{ github.workspace }}/.blender-user
      RUG_TEST_OUTPUT_DIR: ${{ github.workspace }}/runtime-output
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl xz-utils xvfb \
            libgl1 libegl1 libx11-6 libxext6 libxi6 libxrender1 \
            libxfixes3 libxxf86vm1 libxkbcommon0 libsm6

      - name: Download Blender 5.2 Stable
        run: |
          curl --fail --location --retry 3 "$BLENDER_URL" --output blender.tar.xz
          mkdir blender-runtime
          tar -xf blender.tar.xz --strip-components=1 -C blender-runtime
          chmod +x blender-runtime/blender
          blender-runtime/blender --version

      - name: Build and validate official extension ZIP
        run: |
          mkdir -p blender-dist
          blender-runtime/blender --command extension build \
            --source-dir real_uniform_generator \
            --output-filepath blender-dist/real_uniform_generator-v0.5.0.zip
          blender-runtime/blender --command extension validate \
            blender-dist/real_uniform_generator-v0.5.0.zip

      - name: Run source-tree Blender test
        run: |
          mkdir -p "$RUG_TEST_OUTPUT_DIR"
          xvfb-run -a blender-runtime/blender \
            --background --factory-startup --python-exit-code 1 \
            --python tests/blender_smoke_test.py

      - name: Install packaged extension in isolated profile
        run: |
          rm -rf "$BLENDER_USER_RESOURCES" .blender-extension-repo
          mkdir -p "$BLENDER_USER_RESOURCES" .blender-extension-repo
          blender-runtime/blender --command extension repo-add \
            --name "RUG Test" \
            --directory "$GITHUB_WORKSPACE/.blender-extension-repo" \
            --source USER --clear-all rug_test
          blender-runtime/blender --command extension install-file \
            -r rug_test -e blender-dist/real_uniform_generator-v0.5.0.zip

      - name: Run installed-extension Blender test
        run: |
          xvfb-run -a blender-runtime/blender \
            --background --python-exit-code 1 \
            --python tests/installed_extension_smoke_test.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real_uniform_generator-v0.5.0
          path: blender-dist/real_uniform_generator-v0.5.0.zip
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-runtime-outputs-v0.5.0
          path: runtime-output
          if-no-files-found: warn
          retention-days: 14
